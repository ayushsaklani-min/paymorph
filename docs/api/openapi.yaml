        - directMintSettings
        - xrpUsd
        - capabilities
      properties:
        chainId:
          const: 114
        blockNumber:
          $ref: '#/components/schemas/PositiveBaseUnitString'
        contracts:
          type: object
          additionalProperties: false
          required: [registry, assetManagerFXRP, masterAccountController, ftsoV2]
          properties:
            registry:
              $ref: '#/components/schemas/EvmAddress'
            assetManagerFXRP:
              $ref: '#/components/schemas/EvmAddress'
            masterAccountController:
              $ref: '#/components/schemas/EvmAddress'
            ftsoV2:
              $ref: '#/components/schemas/EvmAddress'
        fxrp:
          $ref: '#/components/schemas/TokenMetadata'
        directMintingPaymentAddress:
          $ref: '#/components/schemas/XrplAddress'
        directMintSettings:
          type: object
          additionalProperties: false
          required: [feeBIPS, minimumFeeUBA, executorFeeUBA]
