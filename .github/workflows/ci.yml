name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: paymorph
          POSTGRES_USER: paymorph
          POSTGRES_PASSWORD: paymorph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paymorph -d paymorph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://paymorph:paymorph@localhost:5432/paymorph
      SESSION_SECRET: ci-only-session-secret-at-least-32-bytes
      DATA_ENCRYPTION_KEY_V1: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @paymorph/db migrate:deploy
      - run: pnpm verify

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge fmt --check
        working-directory: packages/contracts
      - run: forge build
        working-directory: packages/contracts
      - run: forge test -vvv
        working-directory: packages/contracts
