[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 10_000
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.ci]
fuzz = { runs = 2_000 }
invariant = { runs = 512, depth = 64, fail_on_revert = false }

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 32
fail_on_revert = false

[rpc_endpoints]
coston2 = "${COSTON2_RPC_URL}"
